[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tg_tool"
version = "0.1.3"
description = "Upload/Download files in Telegram via Pyrogram"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = []
dependencies = [
    "pyrogram",
    "tgcrypto",
]

[project.scripts]
tg-tool = "tg_tools.cli:main"

[tool.setuptools.packages.find]
include = ["tg_tools*"]
